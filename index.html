<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="./manifest.webmanifest"><title>TT Marathon Coach</title>
<style>:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#0f172a;--green:#16a34a;--greenbg:#ecfdf5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}body{padding-bottom:32px}.header{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px 12px}.wrap{max-width:560px;margin:0 auto}.brand{font-size:14px;font-weight:800;color:var(--muted)}h1{font-size:26px;margin:4px 0 2px}.sub{color:var(--muted);font-size:14px}.progress{margin-top:12px}.progress-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:6px}.bar>div{height:100%;background:var(--green);width:0;transition:.25s}main{padding:14px 16px 0}.next{background:var(--accent);color:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 28px rgba(15,23,42,.14)}.next .eyebrow{color:#cbd5e1;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.next h2{margin:7px 0 2px;font-size:24px;line-height:1.15}.next .date{color:#cbd5e1;font-weight:700;font-size:14px}.next .meta{margin-top:12px;display:grid;gap:8px}.next .meta div{background:rgba(255,255,255,.08);padding:10px 12px;border-radius:14px;font-size:14px}.next button{margin-top:14px;width:100%;border:0;background:#fff;color:var(--accent);font-weight:900;border-radius:16px;padding:13px}.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}.filters button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800;color:#334155}.filters button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.week-title{margin:18px 4px 8px;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.card{width:100%;border:1px solid var(--border);border-radius:20px;background:var(--card);padding:14px;margin:9px 0;text-align:left;display:flex;gap:12px;box-shadow:0 7px 20px rgba(15,23,42,.04)}.card.done{background:var(--greenbg);border-color:#bbf7d0}.check{width:26px;height:26px;border-radius:50%;flex:0 0 auto;border:2px solid #cbd5e1;display:grid;place-items:center;margin-top:1px}.done .check{background:var(--green);border-color:var(--green);color:#fff}.content{min-width:0;flex:1}.line1{display:flex;gap:8px;align-items:center;justify-content:space-between}.tnum,.date-small{font-size:13px;font-weight:900;color:var(--muted)}.activity{font-size:18px;font-weight:900;margin-top:4px;line-height:1.2}.done .activity{text-decoration:line-through}.pace{color:#334155;font-size:14px;margin-top:7px;line-height:1.4}.detail{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;font-size:13px;color:#475569;line-height:1.5}.card.open .detail{display:block}.detail b{color:#0f172a}.footer{text-align:center;color:var(--muted);font-size:12px;padding:22px 12px}.badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#f1f5f9;color:#475569}.race{border-color:#fdba74;background:#fff7ed}.race .badge{background:#ffedd5;color:#9a3412}</style>
</head><body><header class="header"><div class="wrap"><div class="brand">🏁 TT Marathon Coach</div><h1>Op weg naar 1 november</h1><div class="sub">Maandag · donderdag · zaterdag</div><div class="progress"><div class="progress-row"><span>Voortgang</span><span id="progressText">0 / 0</span></div><div class="bar"><div id="progressBar"></div></div></div></div></header><main class="wrap"><section class="next" id="nextCard"></section><div class="filters"><button class="active" data-filter="upcoming">Komend</button><button data-filter="all">Alles</button><button data-filter="done">Afgevinkt</button></div><div id="list"></div></main><div class="footer">Tik op een training voor details. Voortgang wordt op dit toestel bewaard.</div>
<script>
const plan=[{"T":"T01","Datum":"2026-09-14","Training":"Herstelduur","Afstand":"8 km","WU":"1 km zeer rustig","Kern":"6 km rustig","CD":"1 km zeer rustig","Tempo":"5:50–6:15/km; HS grofweg ≤145","Doel":"Herstellen en fris worden"},{"T":"T02","Datum":"2026-09-17","Training":"Marathontempo – 3×3 km","Afstand":"13 km","WU":"2 km rustig","Kern":"3×3 km MT, 1 km rustig tussen blokken","CD":"1 km rustig","Tempo":"MT 5:35–5:45/km","Doel":"Marathontempo ontspannen maken"},{"T":"T03","Datum":"2026-09-19","Training":"Lange duurloop herstel","Afstand":"24 km","WU":"2 km rustig","Kern":"22 km ontspannen","CD":"5–10 min wandelen","Tempo":"5:50–6:10/km; HS liefst <150","Doel":"Duur onderhouden"},{"T":"T04","Datum":"2026-09-21","Training":"Rustige duur + strides","Afstand":"9 km","WU":"2 km rustig","Kern":"6 km rustig + 6×20 sec vlot / 60 sec rustig","CD":"1 km rustig","Tempo":"Rustig 5:50–6:10","Doel":"Souplesse"},{"T":"T05","Datum":"2026-09-24","Training":"Drempel – 3×10 min","Afstand":"11 km","WU":"2 km rustig + 4 korte versnellingen","Kern":"3×10 min drempel, 3 min jog","CD":"1–2 km rustig","Tempo":"4:50–5:00/km gecontroleerd","Doel":"Drempel onderhouden"},{"T":"T06","Datum":"2026-09-26","Training":"Lange duur met MT-slot","Afstand":"30 km","WU":"3 km rustig","Kern":"19 km rustig + 8 km MT","CD":"Uitwandelen","Tempo":"Rustig 5:50–6:10; laatste 8 km 5:35–5:45","Doel":"Belangrijkste specifieke duurprikkel"},{"T":"T07","Datum":"2026-09-28","Training":"Herstelduur","Afstand":"7 km","WU":"1 km zeer rustig","Kern":"5 km rustig","CD":"1 km zeer rustig","Tempo":"6:00–6:20/km","Doel":"Herstel na 30 km"},{"T":"T08","Datum":"2026-10-01","Training":"Marathontempo – 2×5 km","Afstand":"14 km","WU":"2 km rustig","Kern":"2×5 km MT, 1 km rustig","CD":"1 km rustig","Tempo":"5:35–5:45/km","Doel":"Stabiele MT-blokken"},{"T":"T09","Datum":"2026-10-03","Training":"Lange duurloop","Afstand":"30 km","WU":"2 km rustig","Kern":"28 km rustig","CD":"Uitwandelen","Tempo":"5:50–6:10/km; geen snelle finish","Doel":"Laatste grote pure duurprikkel"},{"T":"T10","Datum":"2026-10-05","Training":"Herstelduur","Afstand":"8 km","WU":"1 km zeer rustig","Kern":"6 km rustig","CD":"1 km zeer rustig","Tempo":"5:55–6:20/km","Doel":"Vermoeidheid absorberen"},{"T":"T11","Datum":"2026-10-08","Training":"Marathon-specifiek – 12 km MT","Afstand":"16 km","WU":"2 km rustig","Kern":"12 km aaneengesloten MT","CD":"2 km rustig","Tempo":"5:35–5:45/km","Doel":"Wedstrijdritme automatiseren"},{"T":"T12","Datum":"2026-10-10","Training":"Lange duur met MT","Afstand":"27 km","WU":"3 km rustig","Kern":"14 km rustig + 8 km MT + 2 km rustig","CD":"Uitwandelen","Tempo":"Rustig 5:50–6:10; MT 5:35–5:45","Doel":"Laatste zware specifieke combinatie"},{"T":"T13","Datum":"2026-10-12","Training":"Herstelduur","Afstand":"7 km","WU":"1 km zeer rustig","Kern":"5 km rustig","CD":"1 km zeer rustig","Tempo":"6:00–6:20/km","Doel":"Start taper"},{"T":"T14","Datum":"2026-10-15","Training":"Drempel licht – 4×5 min","Afstand":"9 km","WU":"2 km rustig","Kern":"4×5 min drempel, 2 min jog","CD":"1–2 km rustig","Tempo":"4:50–5:00/km","Doel":"Scherpte behouden"},{"T":"T15","Datum":"2026-10-17","Training":"Lange duur taper","Afstand":"21 km","WU":"2 km rustig","Kern":"14 km rustig + 5 km MT","CD":"Uitwandelen","Tempo":"Rustig 5:55–6:15; MT 5:35–5:45","Doel":"Duurgevoel behouden"},{"T":"T16","Datum":"2026-10-19","Training":"Rustig + strides","Afstand":"7 km","WU":"1 km rustig","Kern":"5 km rustig + 5×20 sec strides","CD":"1 km rustig","Tempo":"Rustig; strides soepel","Doel":"Benen fris houden"},{"T":"T17","Datum":"2026-10-22","Training":"Marathontempo – 3×2 km","Afstand":"10 km","WU":"2 km rustig","Kern":"3×2 km MT, 500 m jog","CD":"1–1,5 km rustig","Tempo":"5:35–5:45/km","Doel":"MT bevestigen"},{"T":"T18","Datum":"2026-10-24","Training":"Rustige duur taper","Afstand":"14 km","WU":"1 km rustig","Kern":"12 km rustig","CD":"1 km rustig","Tempo":"5:55–6:15/km","Doel":"Laatste middel-lange duurloop"},{"T":"T19","Datum":"2026-10-26","Training":"Loslopen","Afstand":"6 km","WU":"1 km zeer rustig","Kern":"4 km rustig + 4×15 sec ontspannen","CD":"1 km rustig","Tempo":"6:00–6:20/km","Doel":"Fris blijven"},{"T":"T20","Datum":"2026-10-29","Training":"Race-opener","Afstand":"5 km","WU":"2 km rustig","Kern":"2 km met 3×1 min MT / 2 min rustig","CD":"1 km rustig","Tempo":"Alles comfortabel","Doel":"Benen wakker maken"},{"T":"T21","Datum":"2026-10-31","Training":"Shake-out optioneel","Afstand":"3 km","WU":"—","Kern":"3 km zeer rustig + 3×15 sec ontspannen","CD":"—","Tempo":"Alleen als dit normaal goed voelt","Doel":"Spanning loslopen"},{"T":"RACE","Datum":"2026-11-01","Training":"TT Marathon","Afstand":"42,195 km","WU":"10–15 min wandelen/losmaken","Kern":"Marathon","CD":"Wandelen + herstel","Tempo":"Start 5:42–5:45/km; eerste 5 km beheerst","Doel":"Gelijkmatige marathon"}];
const KEY='tt-marathon-simple-v2';let done=JSON.parse(localStorage.getItem(KEY)||'{}'),filter='upcoming',openId=null;const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const nlDate=i=>new Date(i+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});const shortDate=i=>new Date(i+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'});const isDone=id=>!!done[id];function save(){localStorage.setItem(KEY,JSON.stringify(done))}function toggle(id){done[id]=!done[id];save();render()}function nextTraining(){const t=new Date();t.setHours(0,0,0,0);return plan.find(x=>!isDone(x.T)&&new Date(x.Datum+'T12:00:00')>=t)||plan.find(x=>!isDone(x.T))||plan[plan.length-1]}function weekLabel(i){const d=new Date(i+'T12:00:00'),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));const s=new Date(m);s.setDate(m.getDate()+6);return shortDate(m.toISOString().slice(0,10))+' – '+shortDate(s.toISOString().slice(0,10))}function renderNext(){const x=nextTraining(),el=document.getElementById('nextCard');if(plan.every(p=>isDone(p.T))){el.innerHTML='<div class="eyebrow">Alles afgevinkt</div><h2>Schema voltooid 🎉</h2>';return}el.innerHTML=`<div class="eyebrow">Eerstvolgende training</div><div class="date">${esc(nlDate(x.Datum))} · ${esc(x.T)}</div><h2>${esc(x.Training)}</h2><div class="meta"><div><b>Afstand:</b> ${esc(x.Afstand)}</div><div><b>Tempo:</b> ${esc(x.Tempo)}</div><div><b>Kern:</b> ${esc(x.Kern)}</div></div><button onclick="toggle('${x.T}')">✓ Training afvinken</button>`}function renderProgress(){const c=plan.filter(p=>isDone(p.T)).length;document.getElementById('progressText').textContent=`${c} / ${plan.length}`;document.getElementById('progressBar').style.width=Math.round(c/plan.length*100)+'%'}function renderList(){let items=plan;if(filter==='done')items=plan.filter(p=>isDone(p.T));if(filter==='upcoming'){const i=plan.findIndex(p=>!isDone(p.T));items=plan.filter((p,n)=>n>=Math.max(0,i))}let h='',last='';items.forEach(x=>{const wk=weekLabel(x.Datum);if(wk!==last){h+=`<div class="week-title">${wk}</div>`;last=wk}const d=isDone(x.T),race=x.T==='RACE',open=openId===x.T;h+=`<button class="card ${d?'done':''} ${race?'race':''} ${open?'open':''}" onclick="openId=openId==='${x.T}'?null:'${x.T}';renderList()"><span class="check">${d?'✓':''}</span><span class="content"><span class="line1"><span class="tnum">${esc(x.T)}</span><span class="date-small">${esc(shortDate(x.Datum))}</span></span><span class="activity">${esc(x.Training)}</span><span class="pace">${esc(x.Afstand)} · ${esc(x.Tempo)}</span><span class="badge">${esc(x.Doel)}</span><span class="detail"><b>Warming-up:</b> ${esc(x.WU)}<br><b>Kern:</b> ${esc(x.Kern)}<br><b>Cooling-down:</b> ${esc(x.CD)}<br><br><span onclick="event.stopPropagation();toggle('${x.T}')" style="display:inline-block;background:#0f172a;color:white;padding:9px 12px;border-radius:12px;font-weight:800">${d?'Terugzetten':'✓ Afvinken'}</span></span></span></button>`});document.getElementById('list').innerHTML=h||'<div class="week-title">Nog niets afgevinkt</div>'}function render(){renderProgress();renderNext();renderList()}document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderList()}));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
